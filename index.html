<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="src/output.css" rel="stylesheet">
    <title>Just Another Job Tracker</title>
    <link rel="icon" type="image/svg+xml" href="src/img/list.svg">

    <style>
      table { table-layout: fixed; min-width: 900px; }
      .table-scroll { -webkit-overflow-scrolling: touch; }
      th:nth-child(1), td:nth-child(1) { width: 25%; }
      th:nth-child(2), td:nth-child(2) { width: 14%; }
      th:nth-child(3), td:nth-child(3) { width: 16%; }
      th:nth-child(4), td:nth-child(4) { width: 12%; }
      th:nth-child(5), td:nth-child(5) { width: 10%; }
      th:nth-child(6), td:nth-child(6) { width: 10%; }
      th:nth-child(7), td:nth-child(7) { width: 9%; }
      .cell-truncate {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 sm:p-8">
  <div class="max-w-6xl mx-auto">
 
    <div class="flex items-center justify-between mb-6 gap-3">
      <h1 class="text-xl sm:text-2xl font-semibold text-slate-800">Job Application Tracker</h1>
      <button id="add-row-btn" class="flex items-center gap-1.5 px-3 py-2 rounded-md bg-slate-800 text-white text-sm hover:bg-slate-700">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4">
          <path d="M10.75 4.75a.75.75 0 00-1.5 0v4.5h-4.5a.75.75 0 000 1.5h4.5v4.5a.75.75 0 001.5 0v-4.5h4.5a.75.75 0 000-1.5h-4.5v-4.5z" />
        </svg>
        Add
      </button>
    </div>
 
    <div class="bg-white rounded-lg border border-slate-200 overflow-x-auto table-scroll">
      <table class="w-full text-sm text-left">
        <thead class="bg-slate-100 text-slate-600 uppercase text-xs">
          <tr>
            <th class="px-4 py-3">Company &amp; Position</th>
            <th class="px-4 py-3">Status Stage</th>
            <th class="px-4 py-3">Location</th>
            <th class="px-4 py-3">Salary</th>
            <th class="px-4 py-3">Applied Date</th>
            <th class="px-4 py-3">Follow-up</th>
            <th class="px-4 py-3">Actions</th>
          </tr>
        </thead>
        <tbody id="job-table-body" class="divide-y divide-slate-100 text-slate-700">
          <!-- rows injected by app.js -->
        </tbody>
      </table>
    </div>
 
  </div>
 
  <!-- Add / Edit Modal -->
  <div id="job-modal" class="hidden fixed inset-0 bg-slate-900/40 items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-start justify-between px-6 pt-6">
        <div>
          <h2 id="modal-title" class="text-lg font-semibold text-slate-800">Track New Job Application</h2>
          <p class="text-sm text-slate-400 mt-1">Save application details locally to track status and follow-ups.</p>
        </div>
        <button id="modal-close-btn" class="text-slate-400 hover:text-slate-600">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
            <path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" />
          </svg>
        </button>
      </div>
 
      <form id="job-form" class="px-6 pb-6 pt-4 space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Company Name *</label>
            <input id="field-company" required type="text" placeholder="e.g. Stripe, Google, Acme Inc." class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Job Position / Role *</label>
            <input id="field-role" required type="text" placeholder="e.g. Senior Frontend Engineer" class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300">
          </div>
 
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Application Status Stage</label>
            <select id="field-status" class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300"></select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Salary Range / Compensation</label>
            <input id="field-salary" type="text" placeholder="e.g. $150,000 - $180,000" class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300">
          </div>
 
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Work Mode</label>
            <div class="flex rounded-md border border-slate-200 overflow-hidden text-sm">
              <button type="button" data-mode="REMOTE" class="work-mode-btn flex-1 py-2">Remote</button>
              <button type="button" data-mode="HYBRID" class="work-mode-btn flex-1 py-2 border-l border-slate-200">Hybrid</button>
              <button type="button" data-mode="ONSITE" class="work-mode-btn flex-1 py-2 border-l border-slate-200">Onsite</button>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">City / Location</label>
            <input id="field-location" type="text" placeholder="e.g. San Francisco, CA or Remote" class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300">
          </div>
 
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Date Applied</label>
            <input id="field-date" type="date" class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Follow-up Reminder Date</label>
            <input id="field-followup" type="date" class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300">
          </div>
 
          <div class="sm:col-span-2">
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Job URL / Listing Link</label>
            <input id="field-link" type="url" placeholder="https://company.com/careers/job-id" class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300">
          </div>
 
          <div class="sm:col-span-2">
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Notes &amp; Interview Logs</label>
            <textarea id="field-notes" rows="3" placeholder="Any notes, recruiter conversations, interview prep..." class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300"></textarea>
          </div>
        </div>
 
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="modal-cancel-btn" class="px-4 py-2 rounded-md text-sm text-slate-600 hover:bg-slate-100">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-md text-sm bg-slate-800 text-white hover:bg-slate-700">Save</button>
        </div>
      </form>
    </div>
  </div>
 
  <!-- Delete Confirmation Modal -->
  <div id="delete-modal" class="hidden fixed inset-0 bg-slate-900/40 items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-sm p-6">
      <div class="flex items-start gap-3">
        <div class="w-10 h-10 shrink-0 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
            <path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.63-1.516 2.63H3.72c-1.347 0-2.189-1.463-1.515-2.63L8.485 2.495zM10 6a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 6zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" />
          </svg>
        </div>
        <div class="min-w-0">
          <h2 class="text-base font-semibold text-slate-800">Delete this application?</h2>
          <p id="delete-modal-text" class="text-sm text-slate-500 mt-1">This can't be undone.</p>
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-6">
        <button type="button" id="delete-cancel-btn" class="px-4 py-2 rounded-md text-sm text-slate-600 hover:bg-slate-100">Cancel</button>
        <button type="button" id="delete-confirm-btn" class="px-4 py-2 rounded-md text-sm bg-rose-600 text-white hover:bg-rose-700">Delete</button>
      </div>
    </div>
  </div>
 
<script src="src/app.js"></script>
</body>
</html>
